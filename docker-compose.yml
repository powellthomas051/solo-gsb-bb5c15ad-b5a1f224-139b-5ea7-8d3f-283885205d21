services:
  config-api:
    build: .
    image: json-config-merge:latest
    container_name: json-config-merge
    restart: unless-stopped
    ports:
      - "${CONFIG_PORT:-8000}:8000"
    environment:
      # 容器内固定监听 8000；宿主机端口由 CONFIG_PORT 控制
      CONFIG_HOST: "0.0.0.0"
      CONFIG_PORT: "8000"
      CONFIG_DB_PATH: "/data/config.db"
      CONFIG_HISTORY_MAX_LIMIT: "${CONFIG_HISTORY_MAX_LIMIT:-200}"
      CONFIG_LEASE_DEFAULT_TTL_SECONDS: "${CONFIG_LEASE_DEFAULT_TTL_SECONDS:-60}"
    volumes:
      - config-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  config-data:
